<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEMOSA - Assessor Management</title>
<style>
  :root{
    --header-bg:#2b2b2b;
    --page-bg:#e8e8e8;
    --card-bg:#ffffff;
    --field-bg:#d9d9d9;
    --text-dark:#1a1a1a;
    --btn-bg:#1a1a1a;
    --btn-text:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--page-bg);
    color:var(--text-dark);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    background:var(--header-bg);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:18px 16px;
  }
  header h1{
    font-size:1.4rem;
    letter-spacing:2px;
    font-weight:600;
  }
  .menu-icon{
    position:absolute;
    left:18px;
    font-size:1.4rem;
    cursor:pointer;
  }
  main{
    width:100%;
    max-width:480px;
    background:var(--card-bg);
    margin:20px auto;
    padding:20px 18px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .block h3{
    font-size:0.82rem;
    font-weight:700;
    margin-bottom:10px;
  }
  .panel{
    background:var(--field-bg);
    border-radius:var(--radius);
    padding:16px 12px;
    min-height:340px;
  }
  .field-list{
    list-style:disc;
    padding-left:18px;
    font-size:0.75rem;
    font-weight:600;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .actions{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
  }
  .btn{
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:4px;
    padding:7px 18px;
    font-size:0.75rem;
    cursor:pointer;
  }
  .btn:hover{opacity:0.85;}
  footer{
    width:100%;
    max-width:480px;
    text-align:center;
    font-size:0.65rem;
    color:#555;
    background:#d4d4d4;
    padding:8px 0 24px;
  }

  h3 a {
    color: black;
    text-decoration: none;
    cursor: pointer;
}
</style>
</head>
<body>

<header>
  <span class="menu-icon">&#9776;</span>
  <h1>NEMOSA</h1>
</header>

<main>
  <section id="assessorView" class="hidden">
  <div class="grid-2">
    <div class="card">
      <h3>Add || Edit Task</h3>
      <div class="panel">
        <input id="taskTitle" type="text" placeholder="Task Title" />
        <select id="taskType">
          <option value="Written">Written</option>
              <option value="Practical">Practical</option>
              <option value="Assignment">Assignment</option>
              <option value="Test">Test</option>
        </select>
        <textarea id="taskDesc" placeholder="Instructions"></textarea>
        <input id="dueDate" type="date" />
        <input id="totalMarks" type="number" placeholder="Total Marks" />
        <button id="addTaskBtn" class="primary">Add Task</button>
        <button id="cancelEditBtn" class="secondary hidden">
                Cancel Edit
              </button>
        <h3>Stats</h3>
            <p id="totalTasks">Total Tasks: 0</p>
            <p id="totalSubmissions">Total Submissions: 0</p>
            <p id="avgResult">Average Result: -</p>
      </div>
    </div>
    
    <div class="block">
      <h3>Allocate Marks</h3>
      <div class="panel">
        <select id="assessorLearnerSelect">
          <option value="">Select learner</option>
        </select>
        <select id="assessorTaskSelect">
            <option value="">Select task</option>
        </select>
        <input
            id="assessorMarks"
            type="number"
            min="0"
            max="100"
            placeholder="Marks (0 - 100)"
          />
          <textarea
            id="assessorFeedback"
            placeholder="Add assessor feedback"
          ></textarea>
          <button id="saveAssessmentBtn" class="primary">
            Save Assessment
          </button>
          <div class="card">
          <h3>All Tasks</h3>
          <div id="tasksList" class="tasks-grid"></div>
        </div>
        <div class="card">
          <h3>Submissions</h3>
          <div id="submissionsList"></div>
        </div>
      </section>
        
      </div>
    </div>
  </div>
  
  <div class="actions">
    <button class="btn" onclick="window.history.back('index.html')">Logout</button>
    <button class="btn" onclick="alert('Please Logout')">Next</button>
  </div>
</main>

<footer>All Rights Reserved NEMOSA 2026</footer>
<script type="module" src="task.js"></script>
</body>
</html>
