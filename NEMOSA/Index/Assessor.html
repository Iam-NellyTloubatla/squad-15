<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEMOSA - Assessor Management</title>
<style>
  :root{
    --header-bg:#2b2b2b;
    --page-bg:#e8e8e8;
    --card-bg:#ffffff;
    --field-bg:#d9d9d9;
    --text-dark:#1a1a1a;
    --btn-bg:#1a1a1a;
    --btn-text:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--page-bg);
    color:var(--text-dark);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    background:var(--header-bg);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:18px 16px;
  }
  header h1{
    font-size:1.4rem;
    letter-spacing:2px;
    font-weight:600;
  }
  .menu-icon{
    position:absolute;
    left:18px;
    font-size:1.4rem;
    cursor:pointer;
  }
  main{
    width:100%;
    max-width:480px;
    background:var(--card-bg);
    margin:20px auto;
    padding:20px 18px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .block h3{
    font-size:0.82rem;
    font-weight:700;
    margin-bottom:10px;
  }
  .panel{
    background:var(--field-bg);
    border-radius:var(--radius);
    padding:16px 12px;
    min-height:340px;
  }
  .field-list{
    list-style:disc;
    padding-left:18px;
    font-size:0.75rem;
    font-weight:600;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .actions{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
  }
  .btn{
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:4px;
    padding:7px 18px;
    font-size:0.75rem;
    cursor:pointer;
  }
  .btn:hover{opacity:0.85;}
  footer{
    width:100%;
    max-width:480px;
    text-align:center;
    font-size:0.65rem;
    color:#555;
    background:#d4d4d4;
    padding:8px 0 24px;
  }

  h3 a {
    color: black;
    text-decoration: none;
    cursor: pointer;
}
</style>
</head>
<body>

<header>
  <span class="menu-icon">&#9776;</span>
  <h1>NEMOSA</h1>
</header>

<main>
  <div class="grid-2">
    <div class="block">
      <h3>Assessor Management</h3>
      <div class="panel">
        <ul class="field-list">
          <li>Assessor name</li>
          <li>Subject</li>
          <li>Qualification</li>
          <li>Experience</li>
          <li>Contact details</li>
        </ul>
      </div>
    </div>
    
    <div class="block">
      <h3><a href="admin.html">Admin Management</a></h3>
      <div class="panel">
        <p class="font-size:0.75rem;font-weight:700;margin-bottom:12px;">Assessor can:</p>
        <ul class="field-list">
          <li>Update profiles</li>
          <li>View assigned classes</li>
          <li>Record attendance</li>
          <li>Update Marks</li>
        </ul>
      </div>
    </div>
  </div>
  
  <div class="actions">
    <button class="btn" onclick="window.history.back('Login.html')">Previous</button>
    <button class="btn" onclick="alert('Go to previous page')">Next</button>
  </div>
</main>

<footer>All Rights Reserved NEMOSA 2026</footer>

</body>
</html>
