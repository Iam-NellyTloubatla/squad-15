<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Assessment & Results Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>🎓 Assessments & Results Tracker</h1>

<!-- Dashboard Stats -->
<div class="stats-panel">
<div class="stat-card">
<h3>Overall Average</h3>
<p id="overall-average">0%</p>
</div>

<div class="stat-card">
<h3>Total Written</h3>
<p id="total-written">0</p>
</div>
<div class="stat-card">
<h3>Total Non-Written</h3>
<p id="total-non-written">0</p>
</div>
</div>

<!-- Assessment Input Form -->
<form id="assessment-form">
<div class="form-group">
<label for="title">Assessment Title</label>
<input type="text" id="title" placeholder="e.g., Midterm Exam, Coding Project" required>
</div>

<div class="form-row">
<div class="form-group">

<label for="type">Assessment Type</label>
<select id="type" required>
<option value="Written">Written (Exam, Essay, Quiz)</option>
<option value="Not Written">Not Written (Practical, Presentation, Project)</option>
</select>
</div>

<div class="form-group">
<label for="score">Result Obtained (%)</label>
<input type="number" id="score" min="0" max="100" placeholder="e.g., 85" required>
</div>
</div>

<button type="submit" class="btn-submit">Add Assessment</button>
</form>

<!-- Dynamic Content Lists -->
<div class="lists-container">
<div class="list-section">
<h2>📝 Written Assessments</h2>
<ul id="written-list" class="assessment-list"></ul>
</div>

<div class="list-section">
<h2>💻 Non-Written Assessments</h2>
<ul id="not-written-list" class="assessment-list"></ul>
</div>
</div>
</div>

<!-- Secure Authentication Box -->
<div id="auth-container" class="auth-box">
<h2>🔐 Institutional Portal Login</h2>
<form id="login-form">
<input type="email" id="login-email" 

placeholder="school_email@domain.com" required>
<input type="password" id="login-password" placeholder="Password" required>
<button type="submit" class="btn-login">Verify Identity</button>
</form>
<p id="auth-error" style="color: red; text-align: center;"></p>
</div>

<!-- Main Application Workspace (Hidden by Default via CSS display:none) -->
<div id="app-workspace" style="display: none;">
<header style="display: flex; justify-content: space-between; align-items: center;">
<span id="user-display-email">Welcome User</span>
<button id="btn-logout" style="background:#e74c3c; color:white; 

border:none; padding:8px 12px; cursor:pointer;">Logout</button>
</header>

<!-- Paste your previous Student Form and Assessor Dashboards here -->
</div>


<script src="script.js"></script>
</body>
</html>
